<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Portal - Student Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portal-card">
        <!-- Tab Navigation -->
        <div class="tab-buttons">
            <button id="loginTabBtn" class="active" onclick="switchTab('login')">Login</button>
            <button id="registerTabBtn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginFormSection" class="form-section">
            <h2>Student Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginId">Index / Student ID</label>
                    <input type="text" id="loginId" required placeholder="Enter ID">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter Password">
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>

        <!-- Registration Form -->
        <div id="registerFormSection" class="form-section" style="display: none;">
            <h2>Student Registration</h2>
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="Enter Full Name">
                </div>
                <div class="input-group">
                    <label for="regGrade">Grade</label>
                    <select id="regGrade" required>
                        <option value="">Select Grade</option>
                        <option value="1">Grade 1</option>
                        <option value="2">Grade 2</option>
                        <option value="3">Grade 3</option>
                        <option value="4">Grade 4</option>
                        <option value="5">Grade 5</option>
                        <option value="6">Grade 6</option>
                        <option value="7">Grade 7</option>
                        <option value="8">Grade 8</option>
                        <option value="9">Grade 9</option>
                        <option value="10">Grade 10</option>
                        <option value="11">Grade 11</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="regPhone">WhatsApp / Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="Enter WhatsApp Number">
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="Create Password">
                </div>
                <button type="submit" class="submit-btn">Register Now</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
