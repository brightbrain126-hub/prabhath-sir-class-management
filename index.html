<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightBrain Class Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; background-color: #f4f6f9;
        }
        .bg-slideshow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; transition: background-image 1s ease-in-out;
        }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: rgba(243, 244, 246, 0.65); }
        .top-bar { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; }
        .brand-logo { font-size: 24px; font-weight: bold; color: #7c3aed; display: flex; align-items: center; gap: 10px; }
        .portal-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); overflow: hidden; z-index: 1; margin-top: 40px; }
        .tab-buttons { display: flex; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab-btn { flex: 1; padding: 14px; border: none; background: none; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { color: #7c3aed; background: #ffffff; border-bottom: 3px solid #7c3aed; }
        .card-body { padding: 24px 20px; }
        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header h2 { font-size: 20px; color: #1e293b; margin-bottom: 4px; }
        .form-header p { font-size: 12px; color: #64748b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: #475569; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: #94a3b8; font-size: 14px; }
        .input-wrapper input { width: 100%; padding: 10px 12px 10px 38px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { background: #6d28d9; }
        .form-footer { margin-top: 15px; display: flex; justify-content: space-between; font-size: 12px; }
        .form-footer a { color: #7c3aed; text-decoration: none; font-weight: 600; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="bgSlide" class="bg-slideshow"></div>
    <div class="bg-overlay"></div>

    <div class="top-bar">
        <div class="brand-logo"><i class="fa-solid fa-graduation-cap"></i> BrightBrain</div>
    </div>

    <div class="portal-card">
        <div class="tab-buttons">
            <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')"><i class="fa-solid fa-right-to-bracket"></i> ඇතුළු වන්න</button>
            <button id="registerTabBtn" class="tab-btn" onclick="switchTab('register')"><i class="fa-solid fa-user-plus"></i> ලියාපදිංචිය</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="card-body" onsubmit="handleLogin(event)">
            <div class="form-header">
                <h2>ශිෂ්‍ය ගිණුමට පිවිසෙන්න</h2>
                <p>ලියාපදිංචි අංකය හෝ දුරකථන අංකය ඇතුළත් කරන්න</p>
            </div>
            <div class="form-group">
                <label>INDEX / STUDENT ID හෝ දුරකථන අංකය</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-id-card"></i>
                    <input type="text" id="loginId" required placeholder="උදා: STU1001 හෝ 0766980516">
                </div>
            </div>
            <div class="form-group">
                <label>මුරපදය (PASSWORD)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn-primary">ඇතුළු වන්න <i class="fa-solid fa-arrow-right"></i></button>
            <div class="form-footer">
                <a href="#">මුරපදය අමතකද?</a>
                <a href="admin.html">Admin Panel</a>
            </div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="card-body hidden" onsubmit="handleRegister(event)">
            <div class="form-header">
                <h2>නවාතැන් ලියාපදිංචිය</h2>
                <p>ඔබගේ තොරතුරු ඇතුළත් කර ගිණුමක් සාදාගන්න</p>
            </div>
            <div class="form-group">
                <label>සම්පූර්ණ නම</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="regName" required placeholder="ඔබගේ නම">
                </div>
            </div>
            <div class="form-group">
                <label>දුරකථන අංකය</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="regPhone" required placeholder="07XXXXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label>මුරපදය (PASSWORD)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPassword" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn-primary">ලියාපදිංචි වන්න <i class="fa-solid fa-user-check"></i></button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
