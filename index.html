<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightBrain Learning Management Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0097a7;
            --primary-dark: #006978;
            --bg-light: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --accent: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { color: var(--text); min-height: 100vh; position: relative; overflow-x: hidden; display: flex; flex-direction: column; width: 100%; }

        /* Full Screen Background Educational Slideshow */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.2s ease-in-out;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: rgba(240, 244, 248, 0.88);
        }

        /* Icon Blinking Animation */
        @keyframes pulse-blink {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .blink-icon {
            animation: pulse-blink 1.8s infinite ease-in-out;
            display: inline-block;
        }

        /* Full Width Header / Navbar */
        header { 
            background-color: var(--primary); 
            color: white; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
            flex-wrap: wrap; 
            gap: 15px; 
            z-index: 10; 
            position: relative; 
            width: 100%;
        }
        .logo-title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: bold; cursor: pointer; }
        .nav-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn-header { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-header:hover { background: rgba(255,255,255,0.3); }
        .btn-header-pay { background: #ff9800; color: white; font-weight: bold; }
        .btn-header-pay:hover { background: #e68a00; }

        .lang-select-wrap {
            background: rgba(255,255,255,0.2);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 14px;
        }
        .lang-select-wrap select {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .lang-select-wrap select option {
            color: #2c3e50;
            background: white;
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: #fff;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            z-index: 1000;
            transition: transform 0.2s;
        }
        .whatsapp-float:hover { transform: scale(1.05); }

        /* Extended Full Width Container Layout */
        .container { 
            width: 100%; 
            max-width: 100%; 
            margin: 30px 0; 
            padding: 0 40px; 
            flex: 1; 
        }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; color: var(--primary-dark); }

        /* Auth Form Centered Box */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 20px; width: 100%; }
        .auth-card { background: white; width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; overflow: hidden; }
        .auth-tabs { display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        .auth-tab-btn { flex: 1; padding: 15px; border: none; background: none; font-size: 15px; font-weight: bold; color: #64748b; cursor: pointer; }
        .auth-tab-btn.active { color: var(--primary); background: white; border-bottom: 3px solid var(--primary); }
        .auth-body { padding: 30px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .input-wrap input, .input-wrap select { width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid #e2e8f0; border-radius: 8px; outline: none; font-size: 14px; background: #fff; }
        .btn-auth { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-auth:hover { background: var(--primary-dark); }

        /* Payments Card */
        .payment-card { background: white; width: 100%; max-width: 650px; margin: 20px auto; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; }
        .fee-badge { background: #e0f2f1; color: var(--primary-dark); padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; margin: 15px 0; border: 1px dashed var(--primary); }
        .payment-methods { display: flex; gap: 15px; margin-top: 15px; }
        .pay-option-btn { flex: 1; padding: 15px; border: 1.5px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; text-align: center; font-weight: bold; font-size: 14px; color: #334155; }
        .pay-option-btn.selected { border-color: var(--primary); background: #e0f7fa; color: var(--primary-dark); }

        /* Extended Policy Pages */
        .policy-modal { background: white; width: 100%; max-width: 1200px; margin: 20px auto; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; }
