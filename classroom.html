<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පංති මැදිරිය - Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.html">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 id="classroomTitle" class="text-2xl font-bold text-slate-800">විෂය පංතිය</h1>
                <p class="text-sm text-slate-500" id="studentWelcome">සාදරයෙන් පිළිගනිමු!</p>
            </div>
            <a href="subject_selection.html" class="bg-slate-100 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-200">
                <i class="fa-solid fa-arrow-left"></i> ආපසු
            </a>
        </div>

        <!-- Payment Slip Upload Box -->
        <div class="bg-purple-50 border-2 border-dashed border-purple-300 p-6 rounded-2xl mb-6 text-center">
            <h3 class="font-bold text-purple-900 mb-2"><i class="fa-solid fa-file-invoice-dollar mr-2"></i> මාසික පන්ති ගෙවීම් රිසිට්පත Upload කරන්න</h3>
            <input type="file" id="slipFileInput" accept="image/*" class="mb-3 block mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
            <button onclick="uploadPaymentSlip()" class="bg-purple-600 text-white px-6 py-2 rounded-xl font-semibold shadow hover:bg-purple-700 transition">
                Upload Slip
            </button>
            <p id="slipStatusMsg" class="mt-2 text-xs font-semibold text-emerald-700"></p>
        </div>

        <!-- Class Recordings List -->
        <h3 class="font-bold text-lg text-slate-800 mb-3"><i class="fa-solid fa-play-circle text-purple-600 mr-2"></i> පවතින වීඩියෝ පාඩම්</h3>
        <div class="space-y-3">
            <div class="flex justify-between items-center p-4 bg-slate-50 border rounded-xl">
                <div>
                    <h4 class="font-bold text-slate-800">Unit 01 - Theory Class</h4>
                    <p class="text-xs text-slate-500">නැරඹීමට ඉතිරි වාර: <span id="watchCount">3</span> / 3</p>
                </div>
                <button onclick="playVideo()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-purple-700">නරඹන්න</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
