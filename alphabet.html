<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Alphabet Adventure - Learn A to E!</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for playful kid-friendly typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for cute icon buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            user-select: none;
            overflow-x: hidden;
        }

        /* Animated floating background elements */
        .bg-bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: floatUp 12s infinite linear;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Bounce keyframe animation for main display items */
        .bounce-anim {
            animation: gentleBounce 2s infinite ease-in-out;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        /* Pulse highlight effect */
        .pulse-card {
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.5); }
            100% { box-shadow: 0 20px 35px 5px rgba(255, 105, 180, 0.8); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #e0f2fe;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 10px;
        }

        .text-stroke {
            -webkit-text-stroke: 2px #334155;
        }
        
        .card-pop {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }
        .card-pop:hover {
            transform: translateY(-8px) scale(1.04);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden text-slate-800">

    <div id="bubbles-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <header class="relative z-10 w-full max-w-6xl mx-auto px-4 pt-4 pb-2 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3 bg-white/80 backdrop-blur-md px-5 py-2.5 rounded-full shadow-lg border-2 border-amber-300">
            <span class="text-3xl">🌟</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600">
                Alphabet Magic!
            </h1>
        </div>

        <!-- Mode Switches: Learn Mode / Presentation Video / Mini-Quiz -->
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
            <button id="btn-mode-learn" onclick="switchMode('learn')" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-white font-bold px-4 py-2.5 rounded-2xl shadow-md border-b-4 border-amber-700 active:border-b-0 active:translate-y-1 flex items-center gap-2 transition">
                <i class="fa-solid fa-book-open text-lg"></i>
                <span>Explore</span>
            </button>
            <button id="btn-mode-autoplay" onclick="startAutoPlayLesson()" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-white font-bold px-4 py-2.5 rounded-2xl shadow-md border-b-4 border-teal-700 active:border-b-0 active:translate-y-1 flex items-center gap-2 transition">
                <i class="fa-solid fa-circle-play text-lg animate-pulse"></i>
                <span>Auto Play Lesson</span>
            </button>
            <button id="btn-mode-quiz" onclick="switchMode('quiz')" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-bold px-4 py-2.5 rounded-2xl shadow-md border-b-4 border-purple-800 active:border-b-0 active:translate-y-1 flex items-center gap-2 transition">
                <i class="fa-solid fa-gamepad text-lg"></i>
                <span>Fun Quiz Game</span>
            </button>
        </div>
    </header>

    <main class="relative z-10 w-full max-w-5xl mx-auto px-4 py-2 flex-grow flex flex-col justify-center items-center">

        <!-- ================= LEARN / EXPLORE MODE ================= -->
        <section id="section-learn" class="w-full flex flex-col items-center gap-6">
            
            <!-- Letter Navigation Bar (A B C D E) -->
            <div class="flex justify-center items-center gap-2 sm:gap-4 flex-wrap bg-white/70 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-xl border-4 border-white/80 w-full max-w-2xl">
                <button onclick="selectLetter('A')" id="nav-btn-A" class="letter-nav-btn w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl font-black rounded-2xl bg-rose-400 text-white border-b-4 border-rose-600 shadow-lg hover:scale-110 transition">A</button>
                <button onclick="selectLetter('B')" id="nav-btn-B" class="letter-nav-btn w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl font-black rounded-2xl bg-sky-400 text-white border-b-4 border-sky-600 shadow-lg hover:scale-110 transition">B</button>
                <button onclick="selectLetter('C')" id="nav-btn-C" class="letter-nav-btn w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl font-black rounded-2xl bg-amber-400 text-white border-b-4 border-amber-600 shadow-lg hover:scale-110 transition">C</button>
                <button onclick="selectLetter('D')" id="nav-btn-D" class="letter-nav-btn w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl font-black rounded-2xl bg-emerald-400 text-white border-b-4 border-emerald-600 shadow-lg hover:scale-110 transition">D</button>
                <button onclick="selectLetter('E')" id="nav-btn-E" class="letter-nav-btn w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl font-black rounded-2xl bg-purple-400 text-white border-b-4 border-purple-600 shadow-lg hover:scale-110 transition">E</button>
            </div>

            <!-- Letter Display Main Card -->
            <div id="letter-card-container" class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-amber-200 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
                
                <!-- Left Column: Big Animated Letter display & Phonics -->
                <div class="flex flex-col items-center justify-center w-full md:w-1/3 bg-gradient-to-b from-sky-50 to-blue-100 p-6 rounded-2xl border-2 border-sky-200 shadow-inner text-center">
                    <div id="display-letter" class="text-7xl sm:text-9xl font-black tracking-wider text-rose-500 drop-shadow-md cursor-pointer bounce-anim" onclick="speakCurrentLetter()">
                        Aa
                    </div>
                    
                    <!-- Speaker button for speech synthesis -->
                    <button onclick="speakCurrentLetter()" class="mt-3 bg-pink-500 hover:bg-pink-600 text-white font-bold px-4 py-2 rounded-full shadow-md flex items-center gap-2 border-b-4 border-pink-700 active:translate-y-1 transition">
                        <i class="fa-solid fa-volume-high text-xl"></i>
                        <span class="text-sm">Listen Sound</span>
                    </button>

                    <div class="mt-4 bg-white px-4 py-2 rounded-xl shadow border border-sky-200">
                        <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold block">Phonics Sound</span>
                        <span id="display-phonics" class="text-lg font-extrabold text-indigo-600">/æ/ - /p/ - /l/</span>
                    </div>
                </div>

                <!-- Right Column: Animated Vector Graphic Canvas & Words Grid -->
                <div class="w-full md:w-2/3 flex flex-col gap-4">
                    
                    <!-- Main Active Word Showcase -->
                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-2xl border-2 border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                        <!-- Canvas Illustration Container -->
                        <div class="relative w-40 h-40 bg-white rounded-2xl shadow-md border-2 border-amber-300 flex items-center justify-center p-2 overflow-hidden">
                            <canvas id="illustrationCanvas" width="160" height="160" class="cursor-pointer" onclick="speakCurrentWord()"></canvas>
                        </div>

                        <!-- Word Details & Sentence -->
                        <div class="flex-1 text-center sm:text-left">
                            <div class="flex items-center justify-center sm:justify-start gap-3">
                                <h2 id="active-word-text" class="text-3xl sm:text-4xl font-extrabold text-slate-800">Apple</h2>
                                <button onclick="speakCurrentWord()" class="text-amber-500 hover:text-amber-600 bg-amber-100 p-2 rounded-full hover:scale-110 transition">
                                    <i class="fa-solid fa-volume-high text-2xl"></i>
                                </button>
                            </div>
                            <p id="active-sentence-text" class="text-lg font-medium text-slate-600 mt-2 bg-white/80 p-3 rounded-xl border border-amber-100 shadow-inner">
                                "A is for Apple! Apples are sweet and red!"
                            </p>
                        </div>
                    </div>

                    <!-- 3 Word Example Selector Cards -->
                    <div class="grid grid-cols-3 gap-3" id="word-selector-grid">
                        <!-- Dynamically filled by JS -->
                    </div>

                </div>
            </div>

        </section>

        <!-- ================= QUIZ / MINI GAME MODE ================= -->
        <section id="section-quiz" class="w-full hidden flex-col items-center gap-6">
            <div class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-purple-300 flex flex-col items-center text-center">
                
                <!-- Score & Stars Bar -->
                <div class="w-full flex justify-between items-center bg-purple-100 px-5 py-3 rounded-2xl mb-4 border border-purple-200">
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">⭐</span>
                        <span id="quiz-score" class="text-xl font-black text-purple-800">Score: 0</span>
                    </div>
                    <button onclick="resetQuiz()" class="text-sm font-bold text-purple-600 hover:text-purple-800 underline">
                        Restart Quiz
                    </button>
                </div>

                <!-- Quiz Prompt -->
                <div class="my-4">
                    <span class="bg-purple-200 text-purple-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Fun Challenge</span>
                    <h2 id="quiz-question-title" class="text-2xl sm:text-3xl font-extrabold text-slate-800 mt-2">
                        Find the picture for letter A!
                    </h2>
                    <p id="quiz-question-sub" class="text-slate-500 mt-1 font-medium">Click on the correct picture below</p>
                </div>

                <!-- Quiz Sound Hint Button -->
                <button id="quiz-audio-btn" onclick="playQuizPromptAudio()" class="mb-6 bg-purple-500 hover:bg-purple-600 text-white font-bold px-5 py-2.5 rounded-full shadow-lg flex items-center gap-2 animate-bounce">
                    <i class="fa-solid fa-volume-high text-xl"></i>
                    <span>Repeat Question</span>
                </button>

                <!-- Quiz Options Grid -->
                <div id="quiz-options-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
                    <!-- Dynamic option buttons populated via JavaScript -->
                </div>

                <!-- Feedback Message Container -->
                <div id="quiz-feedback" class="mt-6 text-xl font-extrabold min-h-[32px] transition-all"></div>
            </div>
        </section>

    </main>

    <footer class="relative z-10 w-full text-center py-4 text-xs font-semibold text-slate-600">
        <p>🎨 Interactive Kids English Alphabet Learning App | Designed for Grades 1 - 3</p>
    </footer>

    <!-- Confetti Overlay Canvas for Quiz Victory Celebration -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        
        // Comprehensive Dataset for Letters A to E with examples, phonics, sentences, and color themes
        const ALPHABET_DATA = {
            'A': {
                letter: 'Aa',
                color: '#ef4444', // Red
                bgGradient: 'from-red-100 to-rose-200',
                phonics: '/æ/ - /p/ - /l/',
                items: [
                    { name: 'Apple', sentence: 'A is for Apple! Apples are sweet and red!', type: 'apple' },
                    { name: 'Ant', sentence: 'A is for Ant! The tiny ant works hard!', type: 'ant' },
                    { name: 'Astronaut', sentence: 'A is for Astronaut! Flying high into space!', type: 'astronaut' }
                ]
            },
            'B': {
                letter: 'Bb',
                color: '#0284c7', // Sky Blue
                bgGradient: 'from-sky-100 to-blue-200',
                phonics: '/b/ - /ɔː/ - /l/',
                items: [
                    { name: 'Ball', sentence: 'B is for Ball! Let us bounce the colorful ball!', type: 'ball' },
                    { name: 'Banana', sentence: 'B is for Banana! Monkeys love sweet yellow bananas!', type: 'banana' },
                    { name: 'Bear', sentence: 'B is for Bear! The friendly brown bear gives big hugs!', type: 'bear' }
                ]
            },
            'C': {
                letter: 'Cc',
                color: '#d97706', // Amber / Orange
                bgGradient: 'from-amber-100 to-yellow-200',
                phonics: '/k/ - /æ/ - /t/',
                items: [
                    { name: 'Cat', sentence: 'C is for Cat! The cute kitty says Meow Meow!', type: 'cat' },
                    { name: 'Cake', sentence: 'C is for Cake! Yummy birthday cake with candles!', type: 'cake' },
                    { name: 'Car', sentence: 'C is for Car! Vroom vroom goes the bright red car!', type: 'car' }
                ]
            },
            'D': {
                letter: 'Dd',
                color: '#10b981', // Emerald Green
                bgGradient: 'from-emerald-100 to-teal-200',
                phonics: '/d/ - /ɒ/ - /ɡ/',
                items: [
                    { name: 'Dog', sentence: 'D is for Dog! The happy puppy wags its tail!', type: 'dog' },
                    { name: 'Duck', sentence: 'D is for Duck! Quack quack swims the yellow duck!', type: 'duck' },
                    { name: 'Drum', sentence: 'D is for Drum! Boom boom beats the musical drum!', type: 'drum' }
                ]
            },
            'E': {
                letter: 'Ee',
                color: '#9333ea', // Purple
                bgGradient: 'from-purple-100 to-pink-200',
                phonics: '/e/ - /l/ - /ɪ/ - /f/ - /ə/ - /n/ - /t/',
                items: [
                    { name: 'Elephant', sentence: 'E is for Elephant! The giant elephant has a long trunk!', type: 'elephant' },
                    { name: 'Egg', sentence: 'E is for Egg! Eggs are healthy for breakfast!', type: 'egg' },
                    { name: 'Earth', sentence: 'E is for Earth! We live on our beautiful blue planet Earth!', type: 'earth' }
                ]
            }
        };

        let currentLetterKey = 'A';
        let currentItemIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;
        let quizScore = 0;
        let currentQuizQuestion = null;

        // Speech Synthesis setup
        const synth = window.speechSynthesis;
        let englishVoice = null;

        // Load TTS voice preference
        function loadVoices() {
            if (!synth) return;
            const voices = synth.getVoices();
            // Try to pick a natural friendly English voice
            englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Karen'))) 
                        || voices.find(v => v.lang.startsWith('en')) || null;
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    // Happy cheerful chime
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'wrong') {
                    // Low gentle boing
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    // Soft tap
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                }
            } catch (e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        function speakText(text, callback) {
            if (!synth) return;
            synth.cancel(); // Stop any currently playing audio

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; // Slightly slower for kids clear understanding
            utterance.pitch = 1.2; // Cheerful friendly pitch
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            if (callback) {
                utterance.onend = callback;
            }

            synth.speak(utterance);
        }

        function switchMode(mode) {
            playSound('click');
            if (isAutoPlaying) stopAutoPlay();

            const learnSec = document.getElementById('section-learn');
            const quizSec = document.getElementById('section-quiz');
            const btnLearn = document.getElementById('btn-mode-learn');
            const btnQuiz = document.getElementById('btn-mode-quiz');

            if (mode === 'learn') {
                learnSec.classList.remove('hidden');
                learnSec.classList.add('flex');
                quizSec.classList.add('hidden');
                quizSec.classList.remove('flex');
            } else if (mode === 'quiz') {
                quizSec.classList.remove('hidden');
                quizSec.classList.add('flex');
                learnSec.classList.add('hidden');
                learnSec.classList.remove('flex');
                generateQuizQuestion();
            }
        }

        function selectLetter(letterKey) {
            playSound('click');
            currentLetterKey = letterKey;
            currentItemIndex = 0; // Default to first item (e.g. Apple)
            updateLetterDisplay();
        }

        function selectItem(index) {
            playSound('click');
            currentItemIndex = index;
            updateItemDisplay();
            speakCurrentWord();
        }

        function updateLetterDisplay() {
            const data = ALPHABET_DATA[currentLetterKey];

            // Update active state on letter nav buttons
            ['A', 'B', 'C', 'D', 'E'].forEach(key => {
                const btn = document.getElementById(`nav-btn-${key}`);
                if (key === currentLetterKey) {
                    btn.classList.add('ring-4', 'ring-offset-2', 'ring-amber-400', 'scale-110');
                } else {
                    btn.classList.remove('ring-4', 'ring-offset-2', 'ring-amber-400', 'scale-110');
                }
            });

            // Update Left Big Display
            const displayLetter = document.getElementById('display-letter');
            displayLetter.innerText = data.letter;
            displayLetter.style.color = data.color;
            document.getElementById('display-phonics').innerText = data.phonics;

            // Render Item Selector Grid
            const gridContainer = document.getElementById('word-selector-grid');
            gridContainer.innerHTML = '';

            data.items.forEach((item, idx) => {
                const card = document.createElement('button');
                card.onclick = () => selectItem(idx);
                const isActive = idx === currentItemIndex;
                
                card.className = `card-pop p-3 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition ${
                    isActive ? 'bg-amber-400 text-white border-amber-600 shadow-lg scale-105' : 'bg-white text-slate-700 border-slate-200 hover:border-amber-300'
                }`;
                card.innerHTML = `
                    <span class="text-xl font-black">${item.name}</span>
                    <span class="text-xs ${isActive ? 'text-amber-100' : 'text-slate-400'}">Click to view</span>
                `;
                gridContainer.appendChild(card);
            });

            updateItemDisplay();
        }

        function updateItemDisplay() {
            const data = ALPHABET_DATA[currentLetterKey];
            const item = data.items[currentItemIndex];

            document.getElementById('active-word-text').innerText = item.name;
            document.getElementById('active-sentence-text').innerText = `"${item.sentence}"`;

            // Draw illustration on canvas
            drawCanvasIllustration(item.type);

            // Re-highlight cards in grid
            const gridContainer = document.getElementById('word-selector-grid');
            Array.from(gridContainer.children).forEach((child, idx) => {
                if (idx === currentItemIndex) {
                    child.className = "card-pop p-3 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition bg-amber-400 text-white border-amber-600 shadow-lg scale-105";
                } else {
                    child.className = "card-pop p-3 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition bg-white text-slate-700 border-slate-200 hover:border-amber-300";
                }
            });
        }

        function speakCurrentLetter() {
            const data = ALPHABET_DATA[currentLetterKey];
            speakText(`Letter ${currentLetterKey}. Sound: ${data.phonics.replace(/\//g, '')}`);
        }

        function speakCurrentWord() {
            const item = ALPHABET_DATA[currentLetterKey].items[currentItemIndex];
            speakText(item.sentence);
        }

        function drawCanvasIllustration(type) {
            const canvas = document.getElementById('illustrationCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();

            switch (type) {
                case 'apple':
                    // Red body
                    ctx.beginPath();
                    ctx.arc(cx - 15, cy + 5, 32, 0, Math.PI * 2);
                    ctx.arc(cx + 15, cy + 5, 32, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    // Stem
                    ctx.beginPath();
                    ctx.rect(cx - 4, cy - 40, 8, 18);
                    ctx.fillStyle = '#78350f';
                    ctx.fill();
                    // Green Leaf
                    ctx.beginPath();
                    ctx.ellipse(cx + 12, cy - 32, 14, 7, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#22c55e';
                    ctx.fill();
                    // Cute eyes
                    drawCuteFace(ctx, cx, cy + 10);
                    break;

                case 'ant':
                    // 3 body segments
                    ctx.fillStyle = '#334155';
                    ctx.beginPath(); ctx.arc(cx - 35, cy + 10, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy + 5, 14, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 35, cy - 5, 20, 0, Math.PI * 2); ctx.fill();
                    // Antennae
                    ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(cx + 40, cy - 20); ctx.lineTo(cx + 50, cy - 35); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + 30, cy - 20); ctx.lineTo(cx + 30, cy - 38); ctx.stroke();
                    // Cute face on front head
                    drawCuteFace(ctx, cx + 38, cy - 5);
                    break;

                case 'astronaut':
                    // Helmet
                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2); ctx.fill();
                    // Visor
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.arc(cx, cy - 5, 28, 0, Math.PI * 2); ctx.fill();
                    // Stars spark
                    ctx.fillStyle = '#f59e0b';
                    ctx.font = '20px sans-serif'; ctx.fillText('✨', cx - 50, cy - 30);
                    drawCuteFace(ctx, cx, cy - 5);
                    break;

                case 'ball':
                    // Colorful Beach Ball
                    ctx.beginPath(); ctx.arc(cx, cy, 45, 0, Math.PI * 2);
                    ctx.fillStyle = '#3b82f6'; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 45, 0, Math.PI / 3);
                    ctx.fillStyle = '#ef4444'; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 45, Math.PI * 2/3, Math.PI);
                    ctx.fillStyle = '#eab308'; ctx.fill();
                    drawCuteFace(ctx, cx, cy);
                    break;

                case 'banana':
                    // Yellow crescent
                    ctx.beginPath();
                    ctx.arc(cx, cy - 10, 45, 0.2 * Math.PI, 0.9 * Math.PI);
                    ctx.lineWidth = 26; ctx.strokeStyle = '#facc15'; ctx.lineCap = 'round';
                    ctx.stroke();
                    // Ends
                    ctx.fillStyle = '#854d0e';
                    ctx.beginPath(); ctx.arc(cx - 38, cy + 18, 6, 0, Math.PI * 2); ctx.fill();
                    drawCuteFace(ctx, cx + 5, cy + 20);
                    break;

                case 'bear':
                    // Bear head & ears
                    ctx.fillStyle = '#92400e';
                    ctx.beginPath(); ctx.arc(cx - 30, cy - 25, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 30, cy - 25, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2); ctx.fill();
                    // Snout
                    ctx.fillStyle = '#fde68a';
                    ctx.beginPath(); ctx.arc(cx, cy + 10, 18, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#451a03';
                    ctx.beginPath(); ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2); ctx.fill();
                    drawCuteFace(ctx, cx, cy - 8);
                    break;

                case 'cat':
                    // Ears
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath(); ctx.moveTo(cx - 35, cy - 10); ctx.lineTo(cx - 20, cy - 45); ctx.lineTo(cx - 5, cy - 25); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(cx + 35, cy - 10); ctx.lineTo(cx + 20, cy - 45); ctx.lineTo(cx + 5, cy - 25); ctx.fill();
                    // Head
                    ctx.beginPath(); ctx.arc(cx, cy, 38, 0, Math.PI * 2); ctx.fill();
                    // Whiskers
                    ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(cx - 15, cy + 10); ctx.lineTo(cx - 45, cy + 5); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + 15, cy + 10); ctx.lineTo(cx + 45, cy + 5); ctx.stroke();
                    drawCuteFace(ctx, cx, cy - 2);
                    break;

                case 'cake':
                    // Layers
                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath(); ctx.roundRect(cx - 40, cy, 80, 40, 10); ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.roundRect(cx - 32, cy - 25, 64, 30, 8); ctx.fill();
                    // Candle
                    ctx.fillStyle = '#38bdf8'; ctx.fillRect(cx - 4, cy - 45, 8, 20);
                    // Flame
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath(); ctx.arc(cx, cy - 48, 6, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'car':
                    // Body
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.roundRect(cx - 45, cy - 5, 90, 30, 8); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx - 5, cy - 10, 25, Math.PI, 0); ctx.fill();
                    // Wheels
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath(); ctx.arc(cx - 25, cy + 25, 12, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 25, cy + 25, 12, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'dog':
                    // Ears hanging
                    ctx.fillStyle = '#78350f';
                    ctx.beginPath(); ctx.ellipse(cx - 35, cy - 5, 12, 28, Math.PI / 6, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(cx + 35, cy - 5, 12, 28, -Math.PI / 6, 0, Math.PI * 2); ctx.fill();
                    // Head
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath(); ctx.arc(cx, cy - 5, 36, 0, Math.PI * 2); ctx.fill();
                    // Snout
                    ctx.fillStyle = '#fef3c7';
                    ctx.beginPath(); ctx.arc(cx, cy + 10, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#451a03';
                    ctx.beginPath(); ctx.arc(cx, cy + 2, 6, 0, Math.PI * 2); ctx.fill();
                    drawCuteFace(ctx, cx, cy - 8);
                    break;

                case 'duck':
                    // Yellow duck body & head
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath(); ctx.arc(cx, cy - 15, 26, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(cx - 10, cy + 15, 32, 20, -Math.PI / 8, 0, Math.PI * 2); ctx.fill();
                    // Orange Beak
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath(); ctx.ellipse(cx + 24, cy - 12, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
                    drawCuteFace(ctx, cx + 5, cy - 18);
                    break;

                case 'drum':
                    // Body
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath(); ctx.ellipse(cx, cy - 20, 40, 12, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillRect(cx - 40, cy - 20, 80, 45);
                    ctx.beginPath(); ctx.ellipse(cx, cy + 25, 40, 12, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#93c5fd';
                    ctx.beginPath(); ctx.ellipse(cx, cy - 20, 38, 10, 0, 0, Math.PI * 2); ctx.fill();
                    break;

                case 'elephant':
                    // Head & Ears
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath(); ctx.arc(cx - 32, cy - 10, 22, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 32, cy - 10, 22, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy, 36, 0, Math.PI * 2); ctx.fill();
                    // Trunk
                    ctx.lineWidth = 14; ctx.strokeStyle = '#94a3b8'; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(cx, cy + 15); ctx.quadraticCurveTo(cx + 20, cy + 30, cx + 10, cy + 45); ctx.stroke();
                    drawCuteFace(ctx, cx, cy - 10);
                    break;

                case 'egg':
                    // Egg shape
                    ctx.fillStyle = '#fef3c7';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 32, 44, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 3; ctx.stroke();
                    drawCuteFace(ctx, cx, cy + 5);
                    break;

                case 'earth':
                    // Earth blue sphere
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2); ctx.fill();
                    // Green continents
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath(); ctx.arc(cx - 15, cy - 10, 18, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 18, cy + 15, 14, 0, Math.PI * 2); ctx.fill();
                    drawCuteFace(ctx, cx, cy);
                    break;

                default:
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2); ctx.fill();
                    break;
            }

            ctx.restore();
        }

        // Helper to draw shiny cartoon eyes & smile
        function drawCuteFace(ctx, x, y) {
            // Eyes
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(x - 10, y - 4, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 10, y - 4, 4, 0, Math.PI * 2); ctx.fill();
            // Eye shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x - 11, y - 6, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 9, y - 6, 1.5, 0, Math.PI * 2); ctx.fill();
            // Smile
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(x, y + 2, 7, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
        }

        function startAutoPlayLesson() {
            playSound('click');
            switchMode('learn');
            isAutoPlaying = true;
            
            const btnAuto = document.getElementById('btn-mode-autoplay');
            btnAuto.classList.add('ring-4', 'ring-emerald-300');
            btnAuto.innerHTML = `<i class="fa-solid fa-square text-lg"></i> <span>Stop Lesson</span>`;
            btnAuto.onclick = stopAutoPlay;

            // Sequential autoplay chain
            let letterSequence = ['A', 'B', 'C', 'D', 'E'];
            let currentSeqIdx = 0;

            function playNextInLesson() {
                if (!isAutoPlaying) return;

                if (currentSeqIdx >= letterSequence.length) {
                    stopAutoPlay();
                    speakText("Great job! You finished the entire alphabet lesson!");
                    return;
                }

                currentLetterKey = letterSequence[currentSeqIdx];
                currentItemIndex = 0;
                updateLetterDisplay();

                // Speak current letter and then first example item
                speakText(`Letter ${currentLetterKey}`, () => {
                    if (!isAutoPlaying) return;
                    speakCurrentWord();
                    
                    // Advance to next letter after 5.5 seconds delay
                    autoPlayTimer = setTimeout(() => {
                        currentSeqIdx++;
                        playNextInLesson();
                    }, 5500);
                });
            }

            playNextInLesson();
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            if (synth) synth.cancel();

            const btnAuto = document.getElementById('btn-mode-autoplay');
            btnAuto.classList.remove('ring-4', 'ring-emerald-300');
            btnAuto.innerHTML = `<i class="fa-solid fa-circle-play text-lg animate-pulse"></i> <span>Auto Play Lesson</span>`;
            btnAuto.onclick = startAutoPlayLesson;
        }

        function generateQuizQuestion() {
            const keys = ['A', 'B', 'C', 'D', 'E'];
            const targetKey = keys[Math.floor(Math.random() * keys.length)];
            const data = ALPHABET_DATA[targetKey];
            const targetItem = data.items[Math.floor(Math.random() * data.items.length)];

            // Pick 2 random distractor items from other letters
            const otherItems = [];
            keys.filter(k => k !== targetKey).forEach(k => {
                ALPHABET_DATA[k].items.forEach(it => otherItems.push({ ...it, letterKey: k }));
            });

            // Shuffle distractors
            otherItems.sort(() => 0.5 - Math.random());
            const options = [
                { ...targetItem, letterKey: targetKey, isCorrect: true },
                { ...otherItems[0], isCorrect: false },
                { ...otherItems[1], isCorrect: false }
            ].sort(() => 0.5 - Math.random());

            currentQuizQuestion = {
                letter: targetKey,
                targetItem: targetItem,
                options: options
            };

            // Render Question UI
            document.getElementById('quiz-question-title').innerText = `Find the picture for Letter ${targetKey}!`;
            document.getElementById('quiz-feedback').innerText = '';

            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "card-pop bg-white hover:bg-purple-50 p-4 rounded-2xl border-4 border-purple-200 shadow-lg flex flex-col items-center justify-center gap-3 transition transform active:scale-95";
                
                // Temporary canvas for thumbnail rendering
                const canvasId = `quiz-canvas-${idx}`;
                btn.innerHTML = `
                    <div class="w-24 h-24 bg-purple-50 rounded-xl flex items-center justify-center">
                        <canvas id="${canvasId}" width="90" height="90"></canvas>
                    </div>
                    <span class="text-xl font-black text-slate-800">${opt.name}</span>
                `;

                btn.onclick = () => handleQuizAnswer(opt.isCorrect, opt.name);
                optionsContainer.appendChild(btn);

                // Draw thumbnail option after added to DOM
                setTimeout(() => {
                    const c = document.getElementById(canvasId);
                    if (c) {
                        const ctx = c.getContext('2d');
                        ctx.scale(0.56, 0.56);
                        drawCanvasIllustrationOnCtx(ctx, opt.type);
                    }
                }, 50);
            });

            playQuizPromptAudio();
        }

        function drawCanvasIllustrationOnCtx(ctx, type) {
            // Helper for drawing on small thumbnail canvases
            const dummyCanvas = document.createElement('canvas');
            dummyCanvas.width = 160; dummyCanvas.height = 160;
            const dCtx = dummyCanvas.getContext('2d');
            
            // Draw full scale on temp canvas
            const origCanvas = document.getElementById('illustrationCanvas');
            // Re-use main function logic by drawing on temp
            const cx = 80, cy = 80;
            
            // Render on thumb
            ctx.save();
            ctx.translate(-10, -10);
            // Draw simpler version directly
            ctx.fillStyle = '#a855f7';
            ctx.restore();
        }

        function playQuizPromptAudio() {
            if (!currentQuizQuestion) return;
            speakText(`Click on the picture that starts with letter ${currentQuizQuestion.letter}!`);
        }

        function handleQuizAnswer(isCorrect, name) {
            const feedbackEl = document.getElementById('quiz-feedback');
            if (isCorrect) {
                playSound('correct');
                quizScore += 10;
                document.getElementById('quiz-score').innerText = `Score: ${quizScore}`;
                feedbackEl.className = "mt-6 text-2xl font-black text-emerald-600 animate-bounce";
                feedbackEl.innerText = `🎉 Awesome job! ${name} starts with ${currentQuizQuestion.letter}!`;
                
                triggerConfetti();
                speakText(`Awesome job! ${name} starts with ${currentQuizQuestion.letter}!`);

                setTimeout(() => {
                    generateQuizQuestion();
                }, 2500);
            } else {
                playSound('wrong');
                feedbackEl.className = "mt-6 text-xl font-bold text-rose-500 animate-shake";
                feedbackEl.innerText = `Oops! Try again! Find the item for ${currentQuizQuestion.letter}.`;
                speakText(`Oops! Try again!`);
            }
        }

        function resetQuiz() {
            quizScore = 0;
            document.getElementById('quiz-score').innerText = `Score: 0`;
            generateQuizQuestion();
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    life: 100
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.3; // gravity
                        p.life -= 1.5;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

        function createBackgroundBubbles() {
            const container = document.getElementById('bubbles-container');
            const bubbleCount = 12;

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-bubble';
                const size = Math.random() * 60 + 30;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 6 + 8}s`;
                container.appendChild(bubble);
            }
        }

        window.onload = function() {
            createBackgroundBubbles();
            loadVoices();
            selectLetter('A'); // Initialize with letter A
        };
    </script>
