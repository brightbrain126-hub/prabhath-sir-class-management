<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Admin Panel & Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Admin Panel & System Reports</h1>
                <p class="text-xs text-emerald-600 font-semibold"><i class="fa-solid fa-circle-check"></i> Cross-Device Real-time Database Connected</p>
            </div>
            <a href="index.html" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl text-sm font-semibold shadow">Exit Admin</a>
        </div>

        <!-- Student Management & Payments Section -->
        <h3 class="font-bold text-lg text-purple-800 mb-3"><i class="fa-solid fa-users mr-2"></i> Student Management & Real-time Payments</h3>
        <div class="overflow-x-auto mb-8">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-purple-600 text-white text-xs uppercase tracking-wider">
                        <th class="p-3">Student ID</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Grade</th>
                        <th class="p-3">Phone Number</th>
                        <th class="p-3">Password</th>
                        <th class="p-3">Payment Slip</th>
                        <th class="p-3">Approval Status</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody id="adminStudentTableBody" class="text-sm divide-y divide-slate-200">
                    <!-- Dynamic Data loaded via JS -->
                </tbody>
            </table>
        </div>

        <!-- MCQ Marks & Performance Report Section -->
        <h3 class="font-bold text-lg text-purple-800 mb-3"><i class="fa-solid fa-chart-bar mr-2"></i> MCQ Marks & Exam Performance Report</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-purple-600 text-white text-xs uppercase tracking-wider">
                        <th class="p-3">Student ID</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Grade</th>
                        <th class="p-3">Paper Title</th>
                        <th class="p-3">Marks Obtained</th>
                    </tr>
                </thead>
                <tbody id="adminMarksTableBody" class="text-sm divide-y divide-slate-200">
                    <!-- Dynamic Data loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
